name: release-please

on:
  push:
    branches:
      - master
  # Allows re-running the release check by hand, e.g. after fixing repo
  # settings or when a release PR was closed and needs recreating.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # When release-please actually publishes a release, build the Windows .exe
  # from the tagged commit and attach it to that GitHub Release. This is the
  # only place the project compiles for Windows: there is no PR gate, so the
  # release build is where a Windows regression would surface.
  release-exe:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # UCRT64 toolchain to compile the GTK4/libadwaita cgo build.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita

      # go env reports MSYS2 Unix paths; cygpath -w converts them to the native
      # Windows paths actions/cache expects.
      - name: Locate Go caches
        id: gocache
        run: |
          echo "build=$(cygpath -w "$(go env GOCACHE)")" >> "$GITHUB_OUTPUT"
          echo "mod=$(cygpath -w "$(go env GOMODCACHE)")" >> "$GITHUB_OUTPUT"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"

      # Caches the compiled gotk4/libadwaita packages so a later release build
      # reuses them instead of recompiling the cgo bindings from scratch.
      - name: Cache Go build and module cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: windows-go-${{ steps.gocache.outputs.version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            windows-go-${{ steps.gocache.outputs.version }}-

      - name: make build
        run: make build

      - name: Upload the exe to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" notuya-gui.exe --clobber
