name: windows-build

# Proves notuya-gui still compiles on Windows. The GUI links GTK4/libadwaita
# through cgo, so the build needs the MSYS2 UCRT64 toolchain (its gcc, pkgconf
# and GTK packages), not the plain actions/setup-go Go. Screen Sync is a
# Linux-only stub here; this job only checks that the shared app and the
# Windows stub compile and that `make build` produces notuya-gui.exe.

# Gate only: build on pull requests, never on pushes to feature branches.
# No paths filter: this check is marked required in branch protection, and a
# required check must report on every PR. A paths filter would skip docs-only
# PRs, the check would never report, and the PR would stay blocked forever
# waiting for a status that never arrives. The concurrency block below is what
# keeps the cost down instead.
on:
  pull_request:

# A new commit on a PR cancels the still-running build for its older commit, so
# the slow Windows runner only ever finishes the latest commit of each PR.
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # update: true syncs the pacman base before installing, the pattern the
      # MSYS2 docs recommend and that other Go+GTK4 CI (WiiUDownloader, Rufin)
      # uses, so install: resolves against current packages. Package caching is
      # on by default, so repeat runs skip re-downloading these.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gobject-introspection
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita

      - name: make build
        run: make build

      - name: check the exe was produced
        run: test -f notuya-gui.exe
