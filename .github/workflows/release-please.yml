name: release-please

on:
  push:
    branches:
      - master
  # Allows re-running the release check by hand, e.g. after fixing repo
  # settings or when a release PR was closed and needs recreating.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
